name: Argus Daily Run

# SCHEDULE DISABLED 2026-08-17.
#
# Argus is development governance: it reviews architecture proposals, code
# changes, and governance documents. It plays no part in generating a trade
# signal -- helios_signals does not import it, and every public method in the
# package operates on proposals and components, not prices or positions.
#
# This was NOT disabled because it was broken. As of ad86360 every step
# passes. It is disabled because ci.yml already runs the same checks on every
# push, so a nightly repeat produces no new information while spending Actions
# minutes that helios-nightly needs -- particularly once this repository is
# made private and the free quota drops to 2,000 minutes/month.
#
# To re-enable, restore the `schedule:` block below. Until then it remains
# runnable on demand via workflow_dispatch.
#
#  schedule:
#    - cron: '0 9 * * *'   # daily 09:00 UTC

on:
  workflow_dispatch:  # manual only

permissions:
  contents: read
  issues: write

jobs:
  argus-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke test
        run: |
          python -c "
          import argus, argus_gov, helios_core, rogue_x
          from argus import ArgusCTO, GovernanceEnforcer, ArchitectureValidator
          from rogue_x.config import TradingConfig
          from rogue_x.core import RiskManager
          TradingConfig().validate()
          print('All packages import and config validates')
          "

      - name: Run test suite
        run: pytest -q

      - name: Index governance documents
        run: |
          python -m argus_gov index docs --output docs_index.json
          python -c "import json; d = json.load(open('docs_index.json')); print(f\"Indexed {len(d.get('documents', d))} governance documents\")"

      - name: Create Issue if Analysis Fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Argus Daily Analysis Failed',
              body: 'The Argus daily analysis run has failed. Please review the workflow logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['argus', 'automated']
            })
