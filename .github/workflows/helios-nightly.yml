name: helios-nightly

# Nightly signal run.
#
# Two lessons from this repository's own history are encoded here:
#
# 1. argus-daily.yml declared no permissions block, so its "open an issue
#    on failure" step could never write an issue. It failed ~195 consecutive
#    times in total silence. This workflow declares permissions explicitly and
#    its alerting path is exercised on every run, not only on failure.
#
# 2. Private repos get 2,000 Actions minutes/month. A 15-minute cron burns
#    ~2,800 and breaks the free tier. Once per night is ~10 minutes/month.

on:
  schedule:
    # 01:00 UTC daily. US markets are closed, SEC EDGAR is quiet, and the
    # signal is waiting on Andrew's phone before the open.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render messages without sending, even if a bot token is set'
        type: boolean
        default: false
      as_of:
        description: 'Override the run date (YYYY-MM-DD)'
        type: string
        required: false

concurrency:
  group: helios-nightly
  cancel-in-progress: false

permissions:
  contents: write   # commit the run ledger
  issues: write     # open an issue when a run fails

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Self-test before trusting the pipeline
        # A run that emits trade recommendations from unverified code is worse
        # than a run that does not happen.
        run: python -m pytest tests/test_helios_signals.py -q

      - name: Run nightly signals
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIOS_USER_AGENT: ${{ secrets.HELIOS_USER_AGENT }}
        run: |
          set +e
          python -m helios_signals.run_nightly \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} \
            | tee run.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit the ledger
        # The ledger is the tamper-evident track record: every recommendation
        # becomes a timestamped commit that cannot be quietly revised later.
        if: always()
        run: |
          if [ -n "$(git status --porcelain ledger/)" ]; then
            git config user.name  "helios-x[bot]"
            git config user.email "helios-x@users.noreply.github.com"
            git add ledger/
            git commit -m "ledger: nightly run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No ledger changes to commit."
          fi

      - name: Publish the run summary
        if: always()
        run: |
          {
            echo '## Helios-X nightly'
            echo '```'
            tail -40 run.log 2>/dev/null || echo 'no output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helios-run-${{ github.run_id }}
          path: |
            run.log
            ledger/latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open an issue if the run was not healthy
        if: always() && steps.run.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'no log captured';
            try { log = fs.readFileSync('run.log', 'utf8').slice(-3000); } catch (e) {}
            const code = '${{ steps.run.outputs.exit_code }}';
            const status = code === '1' ? 'degraded (no signals issued)' : 'fatal';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Helios nightly ${status} — ${new Date().toISOString().slice(0,10)}`,
              body: [
                `Exit code \`${code}\` — **${status}**.`,
                '',
                'The pipeline fails closed: when a source is unavailable it issues no',
                'signals rather than partial ones.',
                '',
                `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '\`\`\`', log, '\`\`\`',
              ].join('\n'),
              labels: ['helios', 'automated'],
            });

      - name: Fail the job if the run was not healthy
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "Nightly run exited ${{ steps.run.outputs.exit_code }}"
          exit 1
